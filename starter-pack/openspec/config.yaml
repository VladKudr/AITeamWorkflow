schema: sdd-roles

# context попадает в промпт при генерации ЛЮБОГО артефакта.
# Именно поэтому PM не должен диктовать техдетали руками.
context: |
  Продукт: <название и одно предложение о нём>.
  Main spec: openspec/specs/ — источник истины, поддерживается через archive.
  Терминология — оттуда.
  Стек: <языки, фреймворки, БД, очереди>.
  Стандарты: <API-стиль, обработка ошибок, аудит, безопасность>.
  Тестовый фреймворк: <...>.
  Мы ценим обратную совместимость публичных API.

# rules добавляются только к своему артефакту
rules:
  proposal:
    - Ссылка на интент-бриф PM обязательна
    - Указать rollback-план и затронутые команды
  specs:
    - Использовать формат GIVEN/WHEN/THEN
    - Прежде чем вводить новое требование — проверить существующие в main spec
  test-model:
    - Каждый кейс ссылается на Requirement/Scenario из specs

operations:
  apply:
    guidance:
      - Запускать целевые тесты до полного прогона
      - Ревью diff'а перед каждым следующим таском
  archive:
    guidance:
      - Архивировать только после мерджа PR в main
